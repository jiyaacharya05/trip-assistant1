</style><style id="myra-reference-flow-style">
.query{max-width:90%;border-radius:12px;background:#fff;border-color:#e8eaf0;color:#171717;font-size:15px;font-weight:600;box-shadow:0 1px 3px #12295e0a}
.search-progress{border-radius:14px;background:#f5f6f8;padding:12px 14px;color:#161616;font-size:14px;line-height:1.45;box-shadow:0 1px 2px #14294a0a}
.search-progress-head{display:flex;align-items:center;gap:9px;color:#5b9ccc;font-weight:800;margin-bottom:10px}
.search-progress-head .spark{font-size:19px;color:#4b8cf1;animation:myraSpark 1.1s ease-in-out infinite alternate}
.search-progress-step{background:#fff;border-radius:12px;padding:12px 13px;margin-top:8px}
.search-progress-step strong{display:block;font-size:13px;color:#2d2d2d}
.search-progress-step p{font-size:13px;color:#74777c;font-weight:400;line-height:1.4;margin:7px 0 0}
.search-progress-step .step-check{color:#43a5ec;margin-right:7px}
@keyframes myraSpark{to{transform:rotate(18deg) scale(1.16);opacity:.64}}
.flight-results-wrap{border:1px solid #e6e8ec;border-radius:20px;padding:14px 12px;background:#fff;box-shadow:0 3px 12px #0e224013;margin-top:8px}
.flight-results-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.flight-route-title{display:flex;align-items:center;gap:10px}
.flight-route-icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border:1px solid #cbe5ff;border-radius:14px;background:#f3f9ff;color:#2586ed;font-size:21px}
.flight-route-copy{min-width:0}
.flight-results-route{font-size:17px;line-height:1.25;font-weight:900;color:#181818}
.flight-results-meta{font-size:12px;color:#50545a;font-weight:700;margin-top:4px}
.flight-view-all{padding:4px 0;background:none;color:#1685ed;font-size:13px;font-weight:800;white-space:nowrap}
.flight-carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 1px 8px;scrollbar-width:none}
.flight-carousel::-webkit-scrollbar{display:none}
.myra-flight-result{position:relative;display:block;flex:0 0 100%;min-width:100%;scroll-snap-align:start;padding:15px 15px 13px;border:1px solid #c9e2fb;border-radius:24px;background:linear-gradient(145deg,#cce7ff 0%,#eaf5ff 38%,#f8fbff 70%,#f2effa 100%);box-shadow:0 4px 12px #2878c51c;color:#171717;text-align:left;font-family:Lato,Arial,sans-serif;cursor:pointer;transition:transform .2s,box-shadow .2s,border-color .2s}
.myra-flight-result:hover{transform:translateY(-2px);border-color:#8fc5fa;box-shadow:0 8px 20px #2878c52b}
.myra-flight-brand{display:flex;align-items:center;gap:12px;padding-right:28px;font-weight:900;font-size:20px;min-height:54px}
.myra-airline-mark{display:grid;place-items:center;flex:0 0 48px;width:48px;height:48px;border-radius:15px;background:#eaf4ff;color:#1685ed;font-size:20px;overflow:hidden}
.myra-airline-mark img{width:100%;height:100%;object-fit:contain}
.myra-bookmark{position:absolute;right:16px;top:25px;color:#68717d;font-size:20px;line-height:1}
.myra-bookmark svg{display:block;width:20px;height:22px;stroke:currentColor;stroke-width:1.7;fill:none}
.myra-flight-times{display:flex;flex-direction:column;gap:0;margin:17px 0 7px;padding:0 5px 0 7px}
.myra-flight-times strong{display:inline-block;font-size:18px;color:#191919;min-width:58px}
.myra-flight-times small{display:inline-block;color:#666d78;font-size:15px;margin:0 0 0 2px}
.myra-flight-middle{position:relative;text-align:left;color:#66707a;font-size:14px;margin-left:9px;padding:9px 0 9px 22px;border-left:2px dashed #c8d1dc;line-height:1.2}
.myra-flight-middle:before{content:"";position:absolute;left:-6px;top:50%;width:9px;height:9px;border:2px solid #9aa5b2;border-radius:50%;background:#fff;transform:translateY(-50%)}
.myra-flight-line{display:none}
.myra-flight-times .myra-departure,.myra-flight-times .myra-arrival{position:relative;display:flex;align-items:center;gap:8px;min-height:30px}
.myra-flight-times .myra-departure:before,.myra-flight-times .myra-arrival:before{content:"";flex:0 0 11px;width:11px;height:11px;border:2px solid #8a98a6;border-radius:50% 50% 50% 0;transform:rotate(-45deg);margin-left:-6px}
.myra-flight-times .myra-arrival:before{border-color:#13988e;background:#13988e}

.myra-direct{font-size:14px;color:#555e69;margin:6px 0 14px;padding-left:9px}
.myra-flight-price{display:block;border-top:1px solid #cfe7ff;padding-top:14px;font-size:16px;color:#2686e8;font-weight:900;white-space:nowrap}
.myra-coupon{display:flex;gap:10px;align-items:flex-start;margin:12px -15px -13px;padding:13px 18px 14px;border-top:1px solid #dcecff;border-radius:0 0 24px 24px;background:linear-gradient(105deg,#f4faff 0%,#edf5ff 55%,#f3f0fb 100%);color:#344f9a;font-size:14px;font-weight:700;white-space:normal;line-height:1.3}
.myra-coupon b{color:#4a80ed;font-size:17px;line-height:1}
.myra-flight-dots{display:flex;align-items:center;justify-content:center;gap:7px;padding:8px 0 4px;color:#87909c;font-size:11px}
.myra-flight-dots i{width:7px;height:7px;border-radius:50%;background:#d9dce1}.myra-flight-dots i.active{background:#327cf0;box-shadow:0 0 0 4px #e8f0ff}
.myra-flight-feedback{display:flex;gap:10px;padding:8px 4px 5px}
.myra-flight-feedback button{width:38px;height:36px;border:1px solid #e3e9f5;border-radius:11px;background:#fff;color:#48556b;font-size:16px;cursor:pointer}
.myra-result-hint{font-size:13px;font-weight:800;line-height:1.4;color:#1c2430;padding:2px 4px 0}
.redirecting{position:absolute;inset:0;z-index:15;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#4d97ed;font-size:18px;font-weight:900}
.redirect-orbit{position:relative;width:126px;height:126px;margin-bottom:20px;display:grid;place-items:center}
.redirect-orbit:before,.redirect-orbit:after{content:'';position:absolute;inset:12px;border:1px dashed #c4a9fa;border-radius:50%;animation:myraOrbit 2.2s linear infinite}
.redirect-orbit:after{inset:24px;border-color:#9dc9ff;animation-direction:reverse}
.redirect-plane{position:absolute;top:3px;left:1px;width:48px;height:48px;border-radius:50%;background:#eaf4ff;display:grid;place-items:center;font-size:24px;animation:planeTravel 1.6s ease-in-out infinite alternate}
.redirect-bot{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,#e7f4ff,#eef0ff);display:grid;place-items:center;overflow:hidden}.redirect-bot img{width:52px;height:52px;object-fit:contain}
@keyframes myraOrbit{to{transform:rotate(360deg)}}@keyframes planeTravel{to{transform:translate(17px,-6px) rotate(-12deg)}}
@media(max-width:520px){.myra-flight-result{flex-basis:100%;min-width:100%}.flight-results-wrap{padding:12px 10px}}
</style>

function localDecision(query){
  const q=String(query||'').trim(), lower=q.toLowerCase();
  const title=s=>s.trim().replace(/\b\w/g,c=>c.toUpperCase());
  if(/\b(my trips|saved trips|my bookings|booking history)\b/i.test(q))return {reply:'I’m opening My Trips so you can review saved plans and bookings.',action:'open-panel',payload:{kind:'trips'}};
  if(/\b(wishlist|saved favourites|saved favorites)\b/i.test(q))return {reply:'I’m opening your wishlist.',action:'open-panel',payload:{kind:'wishlist'}};
  if(/\b(sign.?in|log.?in|create account|my account)\b/i.test(q))return {reply:'I’m opening the sign-in options.',action:'open-panel',payload:{kind:'login'}};
  if(/\b(currency|country selector|change currency)\b/i.test(q))return {reply:'I’m opening the country and currency settings.',action:'open-panel',payload:{kind:'locale'}};
  const route=q.match(/\b(?:from)\s+([a-z][a-z .'-]{1,35}?)\s+\bto\s+([a-z][a-z .'-]{1,35}?)(?=\s+(?:on|for|this|next)\b|[,.!?]|$)/i);
  const categories=[
    {category:'Hotels',re:/\b(hotels?|stays?|rooms?|accommodation|resorts?)\b/i},
    {category:'Villas & Homestays',re:/\b(villas?|homestays?|holiday homes?)\b/i},
    {category:'Holiday Packages',re:/\b(holiday packages?|tour packages?|vacation packages?|packages?)\b/i},
    {category:'Tours & Attractions',re:/\b(tours?|tourist places?|attractions?|things to do|places to visit|sightseeing)\b/i},
    {category:'Trains',re:/\b(trains?|rail tickets?)\b/i},
    {category:'Buses',re:/\b(buses?|bus tickets?)\b/i},
    {category:'Cabs',re:/\b(cabs?|taxis?|car rentals?)\b/i},
    {category:'Flights',re:/\b(flights?|airfare|air tickets?)\b/i}
  ];
  const matched=categories.find(x=>x.re.test(q));
  const categoryAtStart=/^\s*(?:flights?|airfare|air tickets?|hotels?|stays?|rooms?|accommodation|resorts?|villas?|homestays?|holiday packages?|tour packages?|vacation packages?|packages?|tours?|tourist places?|attractions?|things to do|places to visit|sightseeing|trains?|rail tickets?|buses?|bus tickets?|cabs?|taxis?|car rentals?)\b/i.test(q);
  const searchIntent=/\b(show|find|search|look(?:ing)? for|browse|compare|open|list|options|results|recommend|suggest|book me|find me|near me|i (?:want|need))\b/i.test(q)
    || categoryAtStart
    || Boolean(matched&&/\b(from|to|in|at|near)\b/i.test(q)&&!/^(?:what|how|why|are|is|do|does|can|will|should|tell me|explain)\b/i.test(q));
  const destinationMatch=q.match(/\b(?:in|at|to|near|for)\s+([a-z][a-z .'-]{1,35}?)(?=\s+(?:under|below|around|for|from|on|between|with|this|next)\b|[,.!?]|$)/i);
  if(route && searchIntent && (!matched || matched.category==='Flights' || matched.category==='Trains' || matched.category==='Buses' || matched.category==='Cabs')){
    const category=matched?.category||'Flights',from=title(route[1]),to=title(route[2]);
    const sort=/\b(top rated|best rated|highest rated|recommended)\b/i.test(q)?'rating':/\b(fastest|quickest|non.?stop)\b/i.test(q)?'fastest':'low';
    return category==='Flights'?{reply:`I’ve found flights from ${from} to ${to}. Compare the sample fares and timings below.`,action:'route',payload:{from,to,sort}}:{reply:`I’m opening ${category.toLowerCase()} from ${from} to ${to}. These are sample results for comparison.`,action:'navigate',payload:{category,from,to,sort}};
  }
  if(matched&&searchIntent){
    const category=matched.category;
    const captured=destinationMatch?.[1]?.trim();
    const destination=captured&&/^(me|here|near me)$/i.test(captured)?(siteContext.to||context.to||''):(captured?title(captured):(siteContext.to||context.to||''));
    const sort=/\b(top rated|best rated|highest rated|recommended)\b/i.test(q)?'rating':/\b(fastest|quickest|non.?stop)\b/i.test(q)?'fastest':'low';
    const reply=`I’m opening ${category.toLowerCase()}${destination?` for ${destination}`:''}. You can review and select a sample result on the page.`;
    return category==='Flights'?{reply:destination?`I’ve opened flight options for your route. Compare the sample fares below.`:'I’ve opened sample flight options for your current route.',action:'search',payload:{sort}}:{reply,action:'navigate',payload:{category,to:destination,sort}};
  }
  if(/\b(cheapest|lowest price|lowest fare|budget flights?)\b/i.test(q) && (!/hotel|villa|package|tour|train|bus|cab/i.test(q)))return {reply:'I’ve sorted the available sample flight fares from lowest to highest.',action:'navigate',payload:{category:'Flights',from:siteContext.from||context.from||'Delhi',to:siteContext.to||context.to||'Bengaluru',sort:'low'}};
  if(/\b(fastest|quickest|non.?stop)\b/i.test(q) && !matched)return {reply:'I’ve selected the fastest sample flight options for your current route.',action:'navigate',payload:{category:'Flights',from:siteContext.from||context.from||'Delhi',to:siteContext.to||context.to||'Bengaluru',sort:'fastest'}};
  if(/\b(baggage|luggage|cancel|cancellation|refund|visa|weather|best time|currency|payment|book|booking|save|wishlist|my trips|sign.?in|login|rating|map|photos?|images?|rooms?|amenities|polic(?:y|ies))\b/i.test(q))return {reply:localSiteAnswer(q),action:null};

}
function localSiteAnswer(query){const q=query.toLowerCase();
  if(/baggage|luggage/.test(q))return 'Baggage allowance depends on the airline and fare. This demo shows sample flight results; check the airline’s official rules before travel.';
  if(/cancel|cancellation|refund/.test(q))return 'Cancellation and refund rules depend on the selected provider and fare. This site is a demo with sample inventory, so it does not issue real tickets or process refunds.';
  if(/visa/.test(q))return 'Visa requirements depend on your passport and destination. Please verify current requirements with the destination’s official immigration website before booking.';
  if(/weather|best time/.test(q))return 'I can help compare destinations and build an itinerary. For current forecasts, check a live weather service; this demo does not provide live weather data.';
  if(/currency/.test(q))return 'Use the country and currency selector in the top navigation to choose a display currency. Sample prices are converted for display only and are not live exchange quotes.';
  if(/my trips|save|wishlist|sign.?in|login/.test(q))return 'Sign in from the account button to save trips, bookings, and wishlist items. My Trips shows items saved to your account.';
  if(/book|booking|payment/.test(q))return 'Choose a result and use its Select or Book button to open the demo booking flow. No real reservation or payment is processed on this sample site.';
  if(/rating/.test(q))return 'Each sample result shows a demo rating. Use the Filter & Sort panel and choose Top Rated to sort the list.';
  if(/map/.test(q))return 'Open a listing with View Details to see its detail page and available location information. This demo inventory is illustrative, not live.';
  if(/photos?|images?|rooms?|amenities|polic(?:y|ies)/.test(q))return 'Open a hotel or villa with View Details to see its gallery, room information, amenities, and policies when available in the sample listing.';
  return 'I can help with flights, hotels, villas and homestays, holiday packages, tours, trains, buses, cabs, trip plans, bookings, and account features.';
}

    }catch(e){typing.remove();add('answer',`<p>Myra is having trouble right now, here are some quick options.</p>`);chips([{label:'Cheapest flights',value:'cheapest flights'},{label:'Show fastest flights',value:'fastest flights'},{label:'Hotels near me',value:'hotels near me'}])}
  }
  async function ask(query){
    query=String(query||'').trim().slice(0,500);if(!query)return;openMessages();input.value='';append('query',esc(query));
    if(editNext&&plan){editNext=false;await makePlan(query);return;}
    // A trip-planning request takes priority over overlapping words such as
    // "budget", "solo", or "Goa", which previously triggered flight shortcuts.
    const websiteIntent=/\b(flights?|hotels?|stays?|rooms?|villas?|homestays?|holiday packages?|tour packages?|tours?|attractions?|places to visit|trains?|buses?|cabs?|taxis?|baggage|luggage|cancel(?:lation)?|refund|visa|weather|currency|payment|booking|book|wishlist|my trips|sign.?in|login|rating|map|photos?|images?|amenities|polic(?:y|ies)|help|hello|hi|hey)\b/i.test(query);
    const planningIntent=isTripPlanningRequest(query)||Boolean(trip.destination&&nextQuestion&&!websiteIntent);
    if(!planningIntent){
      const shortcut=localDecision(query);
      if(shortcut.action==='open-panel'){
        post('open-panel',shortcut.payload||{});add('myra-label','Myra<sup>✦</sup>');add('answer',`<p>${esc(shortcut.reply)}</p>`);speak(shortcut.reply);return;
      }
      if(shortcut.action==='navigate'){
        add('myra-label','Myra<sup>✦</sup>');
        const progress=add('search-progress',`<div class="search-progress-head"><span class="spark">✦</span>Finding the right section...</div><div class="search-progress-step"><strong><span class="step-check">✦</span>Taking you to ${esc(shortcut.payload?.category||'travel results')}</strong><p>I’m setting up the matching search on the main page.</p></div>`);
        post('navigate',shortcut.payload||{});
        setTimeout(()=>{progress.remove();add('status','<b>✦</b>Done! Here’s what I’ve put together!');add('answer',`<p>${esc(shortcut.reply||'I opened the matching sample results on the main page.')}</p><p>Choose a result there to view its details and continue. These are demonstration results, not live availability.</p>`);speak(shortcut.reply||'I opened the matching results on the main page.')},700);
        return;
      }
      if(shortcut.reply&&!shortcut.action){
        add('myra-label','Myra<sup>✦</sup>');add('answer',`<p>${esc(shortcut.reply)}</p>`);
        if(/hello|help with|I can help/i.test(shortcut.reply))chips([{label:'Plan a trip',value:'Plan a trip'},{label:'Cheapest flights',value:'Cheapest flights'},{label:'Hotels near me',value:'Hotels near me'}]);
        speak(shortcut.reply);return;
      }
      if(shortcut.action){
        pendingFlightSearch={query,data:shortcut,from:shortcut.payload?.from||siteContext.from||context.from||'Delhi',to:shortcut.payload?.to||siteContext.to||context.to||'Bengaluru'};
        pendingFlightSearch.progress=add('search-progress',`<div class="search-progress-head"><span class="spark">✦</span>Working on your request... <span style="margin-left:auto;color:#87909c">⌃</span></div><div class="search-progress-step"><strong><span class="step-check">✦</span>I know what you need</strong><p>I’m confirming what success looks like for this request. Everything you need from it is understood.</p><strong style="margin-top:12px"><span class="step-check">✦</span>Checking flight route availability...</strong><p>I’m searching across timings and fares to find flight options that fit what you asked for.</p></div>`);
        post(shortcut.action,shortcut.payload||{});
        setTimeout(()=>{if(pendingFlightSearch?.query===query)showFlightResults(readVisibleFlights())},1400);
        return;
      }
    }
    const api=parent.tripBackend;
    const locallyUpdatedTrip=localTripUpdate(query,trip,nextQuestion);
    if(!api?.configured){if(planningIntent){trip=locallyUpdatedTrip;nextQuestion=firstMissing(trip);add('answer',`<p>I’ve got your ${esc(trip.duration_days?`${trip.duration_days}-day `:'')}${esc(trip.travellers_type||'')} trip to <b>${esc(trip.destination||'')}</b>${trip.budget_inr?` with a budget of <b>₹${Number(trip.budget_inr).toLocaleString('en-IN')}</b>`:''}.</p><p>${esc(questionFor(nextQuestion,trip))}</p>`);return;}add('answer',`<p>${esc(localSiteAnswer(query))}</p>`);chips([{label:'Plan a trip',value:'Plan a trip'},{label:'Cheapest flights',value:'Cheapest flights'},{label:'Hotels near me',value:'Hotels near me'}]);return;}
    const wait=add('typing',planningIntent?'Myra is planning with you…':'Myra is checking your question…');
    try{
      if(!planningIntent){
        const data=await api.invoke('assistant',{message:query,history:history.slice(-8),search_context:siteContext});wait.remove();
        const answer=String(data.reply||'I can help with the travel sections and sample booking flows on this site.').slice(0,1200);
        add('myra-label','Myra<sup>✦</sup>');add('answer',`<p>${esc(answer)}</p>`);
        const nav=data.navigation;
        const allowed=['Flights','Hotels','Villas & Homestays','Holiday Packages','Tours & Attractions','Trains','Buses','Cabs'];
        if(nav&&allowed.includes(nav.category)){
          post('navigate',{category:nav.category,from:String(nav.from||'').slice(0,60),to:String(nav.to||'').slice(0,60),sort:['low','rating','fastest'].includes(nav.sort)?nav.sort:'low'});
          add('answer',`<p>I’ve opened ${esc(nav.category)}${nav.to?` for <b>${esc(nav.to)}</b>`:''} on the main page. Select a sample result there to view its details.</p>`);
        }
        history.push({role:'user',content:query},{role:'assistant',content:answer});speak(answer);return;
      }
      const data=await api.invoke('chat',{message:query,trip:locallyUpdatedTrip,expected_field:nextQuestion,trip_request_id:tripRequestId,history,search_context:siteContext});wait.remove();
      trip={...(data.trip||locallyUpdatedTrip),...(locallyUpdatedTrip.duration_days?{duration_days:locallyUpdatedTrip.duration_days}:{})};tripRequestId=data.trip_request_id||tripRequestId;if(siteContext.hasSearched&&!contextConfirmed&&trip.destination&&trip.start_date&&trip.end_date){contextConfirmed=true;add('answer',`<p>Planning for ${esc(trip.destination)}, ${fmtDate(trip.start_date)}–${fmtDate(trip.end_date)}?</p>`)}history.push({role:'user',content:query});history.push({role:'assistant',content:data.question||data.reply||''});
      if(data.reply&&!String(data.reply).trim().endsWith('?'))add('answer',`<p>${esc(data.reply)}</p>`);
      const missing=firstMissing(trip);if(!missing||data.ready){nextQuestion=null;add('answer',`<p>${esc(data.ready?data.question||'Lovely, I have everything I need. I’m putting your plan together now.':'Lovely, I have everything I need. I’m putting your plan together now.')}</p>`);await makePlan();return;}
      nextQuestion=missing;add('answer',`<p>${esc(questionFor(missing))}</p>`);
      if(missing==='travellers_type')chips([{label:'Solo',value:'Solo'},{label:'Couple',value:'Couple'},{label:'Family (kids/elders)',value:'Family with kids or elders'},{label:'Friends group',value:'Friends'}]);
      if(missing==='pace')chips([{label:'Relaxed',value:'Relaxed pace'},{label:'Normal',value:'Normal pace'},{label:'Packed',value:'Packed pace'}]);
    }catch(e){wait.remove();if(planningIntent){trip=locallyUpdatedTrip;nextQuestion=firstMissing(trip);if(nextQuestion){add('answer',`<p>I’ve got your ${esc(trip.duration_days?`${trip.duration_days}-day `:'')}${esc(trip.travellers_type||'')} trip to <b>${esc(trip.destination||'')}</b>${trip.budget_inr?` with a budget of <b>₹${Number(trip.budget_inr).toLocaleString('en-IN')}</b>`:''}.</p><p>${esc(questionFor(nextQuestion,trip))}</p>`);return;}}else{const fallback=localSiteAnswer(query);add('myra-label','Myra<sup>✦</sup>');add('answer',`<p>${esc(fallback)}</p>`);chips([{label:'Plan a trip',value:'Plan a trip'},{label:'Cheapest flights',value:'Cheapest flights'},{label:'Hotels near me',value:'Hotels near me'}]);return;}add('answer','<p>Myra is having trouble right now, here are some quick options.</p>');chips([{label:'Plan a trip',value:'plan a trip'},{label:'Cheapest flights',value:'cheapest flights'},{label:'Hotels near me',value:'hotels near me'},{label:'Baggage rules',value:'baggage'}]);}
  }
  function readVisibleFlights(){
    try{return [...parent.document.querySelectorAll('#resultList .result-card')].slice(0,5).map(card=>{const route=card.querySelector('.route'),parts=route?[...route.children]:[],priceLabel=card.querySelector('.price h3')?.innerText?.trim()||'',name=card.querySelector('h3')?.innerText?.trim()||'',time=parts[0]?.querySelector('b')?.innerText?.trim()||'',arrival=parts[2]?.querySelector('b')?.innerText?.trim()||'',middle=parts[1]?.innerText||'',stops=/non.?stop/i.test(middle)?0:1;return{name,time,arrival,stops,price_label:priceLabel,duration:middle.match(/\d+h\s*\d*m/i)?.[0]||'2h 45m'}}).filter(f=>f.name&&f.price_label)}catch{return[]}
  }
  function showFlightResults(flights){
    const pending=pendingFlightSearch;if(!pending)return;pendingFlightSearch=null;pending.progress?.remove();
    const from=pending.from,to=pending.to,rows=(flights||[]).slice(0,5),routeLabel=`${esc(from)} <span style="color:#1685ed">→</span> ${esc(to)}`;
    add('myra-label','Myra<sup>✦</sup>');add('status','<b>✦</b>Done! Here’s what I’ve put together!');
    add('answer',`<p>I found flight options from <b>${esc(from)}</b> to <b>${esc(to)}</b> for you. Compare sample fares, timings and stops below.</p>`);
    const dateText=siteContext.start_date?new Intl.DateTimeFormat('en-IN',{day:'numeric',month:'long'}).format(new Date(siteContext.start_date+'T00:00:00')):'Flexible dates';
    const adultCount=Number(siteContext.adults||1);
    const cards=rows.map((f,index)=>{const logo=f.airline_logo?`<img src="${f.airline_logo}" alt="${esc(f.name)} logo">`:airlineLogoMap[f.name]?`<img src="${airlineLogoMap[f.name]}" alt="${esc(f.name)} logo">`:'✈';const arrival=String(f.arrival||'11:15').replace(/\s*\+1/,'');const fare=f.price_label||`₹${Number(f.price||0).toLocaleString('en-IN')}`;const stopText=Number(f.stops||0)===0?'Non Stop':'1 stop';return `<article class="myra-flight-result" data-open-flight="${index}" data-flight-name="${esc(f.name)}" data-flight-time="${esc(f.time||'08:30')}" role="button" tabindex="0" aria-label="Open ${esc(f.name)} flight details"><span class="myra-bookmark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6.5 4.75h11a1 1 0 0 1 1 1v14l-6.5-4-6.5 4v-14a1 1 0 0 1 1-1Z"/></svg></span><span class="myra-flight-brand"><span class="myra-airline-mark">${logo}</span>${esc(f.name)}</span><span class="myra-flight-times"><span class="myra-departure"><strong>${esc(f.time||'08:30')}</strong><small>${esc(from)}</small></span><span class="myra-flight-middle">${esc(f.duration||'2h 45m')} · ${stopText}</span><span class="myra-arrival"><strong>${esc(arrival)}</strong><small>${esc(to)}</small></span></span><span class="myra-direct">${Number(f.stops||0)===0?'Direct Flight':'1 stop'}</span><span class="myra-flight-price">Starting at ${esc(fare)}/per adult&nbsp; ›</span><span class="myra-coupon"><b>✦</b>Sample coupon TRIPSAVER · ₹209 off (demo)</span></article>`}).join('');
    const box=add('flight-results-wrap',`<div class="flight-results-heading"><div class="flight-route-title"><span class="flight-route-icon" aria-hidden="true">✈</span><div class="flight-route-copy"><div class="flight-results-route">${routeLabel}</div><div class="flight-results-meta">${esc(dateText)} &nbsp;|&nbsp; ${adultCount} Adult${adultCount===1?'':'s'}</div></div></div><button class="flight-view-all" type="button" data-view-all>View all&nbsp;❯</button></div><div class="flight-carousel">${cards||'<p>No matching demo flights yet.</p>'}</div><div class="myra-flight-dots"><span data-slide-count>1/${Math.max(rows.length,1)}</span>${rows.map((_,i)=>`<i class="${i===0?'active':''}" data-dot="${i}"></i>`).join('')}</div>`);
    const carousel=box.querySelector('.flight-carousel'),counter=box.querySelector('[data-slide-count]');
    const updateDots=()=>{const cardWidth=carousel.querySelector('.myra-flight-result')?.getBoundingClientRect().width||1;const i=Math.min(rows.length-1,Math.max(0,Math.round(carousel.scrollLeft/(cardWidth+12))));if(counter)counter.textContent=`${i+1}/${Math.max(rows.length,1)}`;box.querySelectorAll('[data-dot]').forEach((dot,n)=>dot.classList.toggle('active',n===i))};
    carousel?.addEventListener('scroll',updateDots,{passive:true});
    box.querySelectorAll('[data-open-flight]').forEach(card=>{const open=()=>redirectToFlight(from,to,Number(card.dataset.openFlight),{name:card.dataset.flightName,time:card.dataset.flightTime});card.addEventListener('click',open);card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}})});
    box.querySelector('[data-view-all]')?.addEventListener('click',()=>redirectToFlight(from,to,0));
    add('myra-flight-feedback','<button type="button" aria-label="Helpful">👍</button><button type="button" aria-label="Not helpful">👎</button><button type="button" aria-label="Save flight">♧</button><button type="button" aria-label="Copy flight details">▢</button>');
    add('myra-result-hint','You can tap any flight card for more details — or view all flights.');
    const actions=add('response-actions','<button type="button" data-more-flights>View all flights</button><button type="button" data-cheapest>Cheapest flights</button>');
    actions.querySelector('[data-more-flights]').onclick=()=>redirectToFlight(from,to,0);actions.querySelector('[data-cheapest]').onclick=()=>ask('Show cheapest flights');
  }
  function redirectToFlight(from,to,index,flight){
    const screen=document.createElement('div');screen.className='redirecting';screen.innerHTML='<div class="redirect-orbit"><span class="redirect-plane">✈</span><span class="redirect-bot"><img src="https://jsak.mmtcdn.com/pwa/platform-myra-ui/static/sub_icons/tp-new-animated-with-con.webp" alt=""></span></div><span>Opening your selected flight</span>';document.querySelector('.shell').appendChild(screen);setTimeout(()=>{post('open-result',{from,to,index,flight_name:flight?.name,flight_time:flight?.time,open_booking:!!flight});setTimeout(()=>screen.remove(),1400)},950);
  }
  window.ask=ask;
  $('form').onsubmit=e=>{e.preventDefault();ask(input.value)};
  document.querySelectorAll('.prompt').forEach(b=>b.onclick=()=>ask(b.dataset.prompt));
  document.querySelector('.prompts').innerHTML=[['Plan a trip','Plan a trip'],['Cheapest flights','Show cheapest flights'],['Hotels near me','Hotels near me']].map(([label,value])=>`<button class="prompt" data-prompt="${value}"><span class="prompt-icon">myr✦</span>${label}</button>`).join('');
  document.querySelectorAll('.prompt').forEach(b=>b.onclick=()=>ask(b.dataset.prompt));
  const oldNew=$('newChat').onclick;
  $('newChat').onclick=()=>{trip={};tripRequestId=null;plan=null;savedItinerary=null;planDirty=true;history=[];editNext=false;contextConfirmed=false;nextQuestion='destination';window.speechSynthesis?.cancel();messages.innerHTML='';messages.classList.remove('active');$('welcome').style.display='block';$('menu').classList.remove('open');greet()};
  const oldTravel=travelAnswer;
  window.addEventListener('message',async e=>{
    if(e.origin!==location.origin)return;const d=e.data||{};
    if(d.type==='myra-auth'){profile=d.profile||null;greet();if(profile?.authenticated&&parent.tripBackend){try{if(!personalizationShown){personalizationShown=true;const tip=await parent.tripBackend.getPastPreferences?.();if(tip)add('answer',`<p>${esc(tip)}</p>`)}const r=await parent.tripBackend.getRecentRequest?.();if(r&&!tripRequestId&&!plan){tripRequestId=r.id;trip={destination:r.destination,start_date:r.start_date,end_date:r.end_date,budget_inr:r.budget_inr,travellers_type:r.travellers_type,interests:r.interests,pace:r.pace};add('answer',`<p>Continue your ${esc(r.destination)} plan?</p>`);chips([{label:'Continue plan',value:'continue my plan'},{label:'Start over',value:'plan a trip'}])}}catch{}}}
    if(d.type==='myra-context')siteContext=d.context||siteContext;
    if(d.type==='myra-results'&&pendingFlightSearch)showFlightResults(d.results||[]);
    if(d.type==='myra-review-update'&&savedItinerary&&d.itinerary?.id===savedItinerary.id){savedItinerary={...savedItinerary,...d.itinerary};renderPlan(plan)}
  });
  parent.postMessage({type:'myra-ready'},location.origin);greet();
  $('voice').onclick=voiceChat;
})();
</script>
