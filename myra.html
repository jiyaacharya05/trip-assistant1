.query{max-width:90%;border-radius:12px;background:#fff;border-color:#e8eaf0;color:#171717;font-size:15px;font-weight:600;box-shadow:0 1px 3px #12295e0a}

  document.querySelector('.prompts').innerHTML=[['Plan a trip','Plan a trip'],['Cheapest flights','Show cheapest flights'],['Hotels near me','Hotels near me']].map(([label,value])=>`<button class="prompt" data-prompt="${value}"><span class="prompt-icon">myr✦</span>${label}</button>`).join('');
  document.querySelectorAll('.prompt').forEach(b=>b.onclick=()=>ask(b.dataset.prompt));
  const oldNew=$('newChat').onclick;
  $('newChat').onclick=()=>{trip={};tripRequestId=null;plan=null;savedItinerary=null;resumeCandidate=null;planDirty=true;history=[];editNext=false;contextConfirmed=false;planConversationActive=false;nextQuestion='destination_dates';window.speechSynthesis?.cancel();messages.innerHTML='';messages.classList.remove('active');$('welcome').style.display='block';$('menu').classList.remove('open');greet()};
  const oldTravel=travelAnswer;
  window.addEventListener('message',async e=>{
    if(e.source!==parent||(location.origin!=='null'&&e.origin!==location.origin&&e.origin!=='null'))return;const d=e.data||{};
    if(d.type==='myra-auth'){profile=d.profile||null;greet();if(profile?.authenticated&&parent.tripBackend&&!planConversationActive&&!plan&&!tripRequestId&&!messages.children.length){try{const r=await parent.tripBackend.getRecentRequest?.();if(r&&$('welcome').style.display!=='none'&&!messages.children.length){resumeCandidate=r;add('answer','<p>Continue your '+esc(r.destination)+' plan?</p>');chips([{label:'Continue plan',value:'__continue_recent__'},{label:'Start a new trip',value:'__start_over__'}])}}catch{}}}
    if(d.type==='myra-context'){siteContext={...siteContext,...(d.context||{})};if(d.context?.currency){const saved=readSavedCurrency();if(d.context.currency.userSelected===true||saved)applyDisplayCurrency(saved||d.context.currency,true);else if(validDestination(trip.destination||d.context.to))applyDestinationCurrency(trip.destination||d.context.to)}}
    if(d.type==='myra-results'&&pendingFlightSearch)showFlightResults(d.results||[]);
    if(d.type==='myra-listing-results'){const category=String(d.category||'travel').slice(0,60),items=Array.isArray(d.results)?d.results.slice(0,12):[];add('myra-label','Myra<sup>✦</sup>');if(!items.length){add('answer',`<p>I couldn’t find any matching ${esc(category.toLowerCase())} in the website results for ${esc(d.to||'that location')}. Try another destination or open the ${esc(category)} section.</p>`)}else{const block=add('answer',`<div class="flight-card" style="display:block;padding:14px"><b>${esc(category)} in ${esc(d.to||'your selected destination')}</b><p style="margin:5px 0 12px;color:#687385">Here are the options currently shown on the website:</p><div data-myra-site-list></div></div>`),list=block.querySelector('[data-myra-site-list]');items.forEach((item,index)=>{const row=document.createElement('div');row.style.cssText='display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #edf0f4';row.innerHTML=`<div><b>${esc(String(item.name||'Option'))}</b>${item.description?`<div style="font-size:12px;color:#748092;margin-top:3px">${esc(String(item.description))}</div>`:''}<div style="font-size:13px;color:#178b78;margin-top:4px">${esc(String(item.price||''))}</div></div><button class="text-btn" type="button" style="white-space:nowrap">View</button>`;row.querySelector('button').addEventListener('click',()=>post('open-result',{index:Number(item.index??index),category,to:d.to||''}));list.appendChild(row)})}}
    if(d.type==='myra-review-update'&&savedItinerary&&d.itinerary?.id===savedItinerary.id){savedItinerary={...savedItinerary,...d.itinerary};renderPlan(plan)}
  });
  parent.postMessage({type:'myra-ready'},location.origin==='null'?'*':location.origin);greet();
  $('voice').onclick=voiceChat;
})();
</script>
</body></html>
